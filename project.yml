name: InventarIA
options:
  bundleIdPrefix: com.inventaria
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: "7.10.0"

targets:
  InventarIA:
    type: application
    platform: iOS
    sources:
      - InventarIAApp.swift
      - ContentView.swift
      - Models
      - Services
      - Theme
      - Utils
      - ViewModels
      - Views
      - Assets.xcassets
      - path: GoogleService-Info.plist
        buildPhase: resources
    # Generamos un Info.plist explícito (en lugar de
    # GENERATE_INFOPLIST_FILE) porque necesitamos declarar CFBundleURLTypes
    # con el REVERSED_CLIENT_ID de Google — el callback OAuth de Firebase
    # regresa por ese scheme. Sin esto el botón "Iniciar sesión con Google"
    # abre el browser pero no puede volver a la app.
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "InventarIA necesita acceso a la cámara para escanear productos y códigos de barras con IA"
        NSPhotoLibraryUsageDescription: "InventarIA necesita acceso a tus fotos para agregar imágenes de productos"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.inventaria.app.google-oauth
            CFBundleURLSchemes:
              - com.googleusercontent.apps.340434979291-8eai9o3f3fnr7ldcf66m4seauglrsq9l
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inventaria.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "YES"
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_ENTITLEMENTS: InventarIA.entitlements
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: Kingfisher
